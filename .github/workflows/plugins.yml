name: Plugins

# Builds every plugin and attaches the packages that do not exist yet (<id>-<version>.zip) to the "plugins" release.
# A published version is never overwritten: increase "version" in plugin.json to publish a change.
on:
  push:
    branches: [main]
    paths: ["plugins/**", "tools/build-plugins.ps1", ".github/workflows/plugins.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugins
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # the plugin API (NeoIDE.Sdk) comes from the NeoIDE repository
      - uses: actions/checkout@v4
        with:
          repository: NeoPHP-Framework/NeoIDE
          path: .neoide

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Build the plugins
        shell: pwsh
        run: ./tools/build-plugins.ps1

      - name: Publish the new packages
        shell: pwsh
        run: |
          gh release view plugins *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create plugins --title "NeoIDE plugins" --latest=false `
              --notes "Packages of the NeoIDE plugins, installed from Settings › Plugins. Generated by the Plugins workflow: do not edit."
          }
          $existing = gh release view plugins --json assets --jq ".assets[].name"
          foreach ($zip in Get-ChildItem dist -Filter *.zip) {
            if ($existing -contains $zip.Name) { Write-Host "$($zip.Name): already published"; continue }
            gh release upload plugins $zip.FullName
            if ($LASTEXITCODE -ne 0) { throw "upload of $($zip.Name) failed" }
            Write-Host "$($zip.Name): published"
          }
          $global:LASTEXITCODE = 0
